<!-- 0. INTRO -->
<div id="intro" role="region" aria-label="Introduction">
<video id="intro-video" muted="" playsinline="" preload="none"></video>
<canvas id="intro-gl" aria-hidden="true"></canvas>
<div class="intro-stage" id="intro-stage">
<div class="intro-card" id="intro-thanks" style="--y:46%">
<span class="intro-title">Thank You</span>
<span class="intro-sub">For Growing With Us</span>
</div>
<div class="intro-card" id="intro-name" style="--y:46%">
<span class="intro-title">Juniper Collective</span>
</div>
</div>
<div class="intro-ui" style="left:20px">
<button type="button" id="intro-sound" aria-pressed="false" aria-label="Toggle sound">
<svg class="i" aria-hidden="true" focusable="false"><use id="intro-sound-use" href="#i-volume"/></svg>
<span id="intro-sound-label">Sound</span>
</button>
<span id="intro-sound-hint" hidden="">Tap anywhere for sound</span>
</div>
<div class="intro-ui" style="right:20px">
<button type="button" id="intro-skip">Skip intro</button>
</div>
</div>
